plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'app.sakura.fishing'
    compileSdk 34

    defaultConfig {
        applicationId "app.sakura.fishing"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters((project.findProperty("ciAbi") ?: "arm64-v8a") as String)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"
        buildPython "python3.10"
        pip {
            install "numpy==1.23.3"
            install "opencv-python==4.5.1.48"
        }
    }
}
