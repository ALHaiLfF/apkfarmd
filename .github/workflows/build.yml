name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: set -o pipefail; gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          {
            grep -n -E "What went wrong|Could not|error:|^e: |FAILED|No matching|ERROR|Caused by" -A6 build.log | head -120
            echo "----- tail -----"
            tail -40 build.log
          } > err.txt
          msg=$(head -c 30000 err.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=gradle::$msg"
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk SakuraFishing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SakuraFishing-apk
          path: SakuraFishing.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Рыбачка build ${{ github.run_number }}
          files: SakuraFishing.apk
